services:
  app:
    build: .
    restart: always
    read_only: true
    ports:
      - "127.0.0.1:${SHIBUMI_PORT:-9001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/shibumi-forms.sqlite
    env_file:
      - .env.production
    volumes:
      - forms-data:/data
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  forms-data:
